name: web3j tests on plain ubuntu with java

on: [ push ]

jobs:
  mvn_build_test:
    name: Maven Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'maven'

      - name: Build & test with Maven
        run: mvn -B clean install

  besu_deployment_test:
    name: Besu Node & Contract Deployment
    runs-on: ubuntu-latest
    needs: mvn_build_test
    services:
      besu:
        image: hyperledger/besu:latest
        options: >-
          --network-alias besu
        ports:
          - 8545:8545
        env:
          BESU_NETWORK: dev
          BESU_RPC_HTTP_ENABLED: "true"
          BESU_RPC_HTTP_HOST: 0.0.0.0
          BESU_RPC_HTTP_API: ETH,NET,WEB3
          BESU_RPC_HTTP_CORS_ORIGINS: "all"
          BESU_RPC_WS_ENABLED: "true"
          BESU_MINER_ENABLED: "true"
          BESU_MINER_COINBASE: "0x9f162b41fa8e44f885bedae410418145a4e8ed06"
          BESU_MINER_STRATUM_MINING_THREADS: "1"
          BESU_MIN_BLOCK_FILL_PERCENTAGE: "100"
          BESU_HOST_ALLOWLIST: "*"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'maven'

      - name: Wait for Besu node to be ready
        run: |
          for i in $(seq 1 60); do
            response=$(curl -sS -X POST -H "Content-Type: application/json" \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              http://localhost:8545 || true)

            # Check if we have a proper JSON response with result
            if echo "$response" | grep -q '"result"'; then
              echo "Besu node is responding"
              # Additional check to ensure mining is working
              blockResponse=$(curl -sS -X POST -H "Content-Type: application/json" \
                --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
                http://localhost:8545 || true)
              if echo "$blockResponse" | grep -q '"result"'; then
                echo "Besu node is ready for deployments"
                sleep 3
                exit 0
              fi
            fi
            echo "Waiting for Besu node... ($i/60)"
            echo "Last response: $response"
            sleep 2
          done
          echo "Besu node failed to start"
          exit 1

      - name: Compile app for deployment demo
        run: mvn -B -DskipTests compile

      - name: Deploy Smart Contracts via PipelineLocalTestPrepDemo
        run: mvn exec:java -Dexec.mainClass="com.julius.spring.boot.ethweb3.demo.PipelineLocalTestPrepDemo"

      - name: Dump Besu logs on failure
        if: failure()
        run: docker logs ${{ job.services.besu.id }}

